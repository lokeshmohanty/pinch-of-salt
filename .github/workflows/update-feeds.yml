name: Update News & Deploy

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      
      - name: Build and Run Core Engine
        run: |
          mkdir -p data/clusters data/articles
          uv run src/python/main.py
      
      - name: Commit new data back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/clusters/ data/articles/ data/index.json data/feeds.yaml
          git diff --cached --quiet || git commit -m "📰 Update news data [skip ci]"
          git push
      
      - name: Prepare Deployment
        run: |
          mkdir -p public/data/clusters public/data/articles
          cp -r src/frontend/* public/
          cp data/index.json public/data/
          cp -r data/clusters/ public/data/clusters/
          cp -r data/articles/ public/data/articles/
          touch public/.nojekyll
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
